<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Mission Systems Written Comp Study App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Mission Systems Written Comp</h1>
      <p>Interactive review, equation-card recognition, and mixed practice.</p>
    </div>
    <button id="themeBtn" class="ghost">Toggle theme</button>
  </header>

  <nav class="tabs" aria-label="Main navigation">
    <button class="tab active" data-view="dashboard">Dashboard</button>
    <button class="tab" data-view="modules">Modules</button>
    <button class="tab" data-view="equations">Equation Cards</button>
    <button class="tab" data-view="quiz">Quiz</button>
    <button class="tab" data-view="missed">Missed Concepts</button>
  </nav>

  <main id="app" class="container"></main>

  <footer>
    <p>Built for Mission Systems Written Comp preparation. Progress is stored locally in your browser.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
